    <!--
      Anti-FOUC theme bootstrap. Must run before paint to avoid a light-flash
      for dark-OS users and a dark-flash for light-OS users. Mirrors the logic
      in src/hooks/useTheme.ts (same storage key, same prefers-color-scheme
      fallback). Keep these two in sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mojju-theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = resolved;
        } catch (_) {
          /* localStorage / matchMedia unavailable — fall through to default light */
        }
      })();
    </script>
